<!doctype html><html><head><meta charset=utf-8>
<link rel=stylesheet href=base.css>
<style>body{background:transparent}.sub-wrap{bottom:14%}.sub-word{font-size:clamp(22px,5.2vw,48px);line-height:1.35}</style>
</head><body>
<div class=stage><div class=sub-wrap id=wrap></div></div>
<script>
const q=new URLSearchParams(location.search);
const text=q.get('text')||'', start=+q.get('start')||0, end=+q.get('end')||2;
const words=text.trim().split(/\s+/).filter(Boolean);
const wrap=document.getElementById('wrap');
words.forEach((w,i)=>{const s=document.createElement('span');s.className='sub-word';s.textContent=w;s.dataset.i=i;wrap.appendChild(s)});
class S{constructor(){this.x=0;this.v=0;this.k=320;this.c=18;this.t=0}
set(t){this.t=t} step(dt){const a=-this.k*(this.x-this.t)-this.c*this.v;this.v+=a*dt;this.x+=this.v*dt;return this.x}}
const springs=words.map(()=>new S());
let t0=performance.now(); const dur=Math.max(.01,end-start);
function f(n){const t=(n-t0)/1000,dt=Math.min(.033,(n-(f.p||n))/1000);f.p=n;
  words.forEach((_,i)=>{const appear=(i+.3)/words.length*dur*.7; if(t>=appear) springs[i].set(1);
    if(t>dur-.15) springs[i].set(0);
    const x=springs[i].step(dt); const el=wrap.children[i];
    el.style.transform=`scale(${.4+x*.7}) translateY(${(1-x)*20}px)`; el.style.opacity=Math.min(1,x*1.5);
  });
  requestAnimationFrame(f)}
requestAnimationFrame(f); window.__DURATION=dur+.2; window.__READY=true;
</script></body></html>
