async function db(st,mode,fn){const d=await idb;return new Promise((ok,er)=>{const t=d.transaction(st,mode),s=t.objectStore(st);const r=fn(s);t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>er(t.error)})}
const putB=(k,b)=>db("blob","readwrite",s=>s.put(b,k)),getB=k=>db("blob","readonly",s=>s.get(k));
const URLS={};async function burl(k){if(!k)return"";if(URLS[k])return URLS[k];const b=await getB(k);return b?(URLS[k]=URL.createObjectURL(b)):""}
async function setB(k,b){if(URLS[k])URL.revokeObjectURL(URLS[k]);delete URLS[k];await putB(k,b)}

pt_imgp:[["pollinations","Pollinations (miễn phí, không key)"],["hf","Hugging Face FLUX (token miễn phí)"],["openai","OpenAI GPT Image (trả phí)"],["demo","Demo"]],

async function llm(sys,user){const p=TXT();
if(p=="openai"){const r=await fetch("https://api.openai.com/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+S.pt_okey},body:JSON.stringify({model:S.pt_om||"gpt-6.1-sol",messages:[{role:"system",content:sys},{role:"user",content:user}],response_format:{type:"json_object"}})});const j=await r.json();if(!r.ok)throw new Error("OpenAI "+r.status+": "+(j.error?.message||""));return j.choices[0].message.content}
if(p=="claude"){const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":S.pt_ckey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:S.pt_cm||"claude-fable-5-1",max_tokens:16000,system:sys+"\nReturn ONLY valid JSON, no markdown.",messages:[{role:"user",content:user}]})});const j=await r.json();if(!r.ok)throw new Error("Claude "+r.status+": "+(j.error?.message||""));return j.content.map(c=>c.text||"").join("")}
if(p=="gemini"){const m=S.pt_gm||"gemini-2.5-flash";const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`,{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":S.pt_gkey},body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents:[{parts:[{text:user}]}],generationConfig:{responseMimeType:"application/json"}})});const j=await r.json();if(!r.ok)throw new Error("Gemini "+r.status+": "+(j.error?.message||""));return j.candidates[0].content.parts.map(x=>x.text).join("")}
if(p=="pollinations"||p=="compat"){const u=p=="compat"?(S.pt_cbase||"https://api.groq.com/openai/v1").replace(/\/$/,"")+"/chat/completions":"https://text.pollinations.ai/openai";const hd={"Content-Type":"application/json"};if(p=="compat"){if(!S.pt_xkey)throw new Error("Groq/OpenRouter: "+tr("Chưa có key"));hd.Authorization="Bearer "+S.pt_xkey}
for(let a=0;a<3;a++){const r=await fetch(u,{method:"POST",headers:hd,body:JSON.stringify({model:p=="compat"?(S.pt_xm||"llama-3.3-70b-versatile"):"openai-fast",messages:[{role:"system",content:sys+"\nReturn ONLY valid JSON."},{role:"user",content:user}],response_format:{type:"json_object"},...(p=="pollinations"?{reasoning_effort:"low",max_tokens:12000}:{})})});const j=await r.json().catch(()=>({}));if(r.ok&&j.choices)return j.choices[0].message.content;if(a==2||r.status!=429&&r.status<500&&!(p=="pollinations"&&r.status==400))throw new Error((p=="compat"?"LLM ":"Pollinations ")+r.status+": "+(j.error?.message||j.error||""));await new Promise(z=>setTimeout(z,6000))}}
await new Promise(r=>setTimeout(r,600));return JSON.stringify(demoScript())}
function pj(t){t=t.replace(/^```(json)?|```$/gm,"").trim();const a=t.indexOf("{"),b=t.lastIndexOf("}");return JSON.parse(t.slice(a,b+1))}
function demoScript(){const L=[["Ông Mặt Trời","Chào các bạn nhỏ! Hôm nay có một cuộc đua rất vui!"],["Thỏ Bông","Ha ha! Rùa ơi, cậu chậm như... một cục đá biết đi!"],["Rùa Xanh","Chậm mà chắc, Thỏ ạ. Mình đua thử nhé!"],["Thỏ Bông","Mình nghỉ một chút dưới gốc cây... ngáp!"],["Rùa Xanh","Từng bước, từng bước, mình sắp tới rồi!"],["Ông Mặt Trời","Rùa về đích! Chậm mà chắc, các bạn nhớ nhé!"]];

return{title:"Rùa và Thỏ ở làng Lúa Vàng",moral:"Chậm mà chắc, không được kiêu ngạo.",summary:"Thỏ Bông kiêu ngạo thách Rùa Xanh chạy đua quanh làng. Thỏ ngủ quên dưới gốc đa, Rùa kiên trì về đích trước.",
characters:[{name:"Thỏ Bông",role:"nhân vật chính, kiêu ngạo nhưng đáng yêu",look:"small white bunny, pink inner ears, red scarf, buck teeth, big blue eyes",voice:"child_boy"},{name:"Rùa Xanh",role:"chậm rãi, kiên trì",look:"small green turtle, yellow belly, brown patterned shell, tiny round glasses, straw nón lá hat",voice:"child_girl"},{name:"Ông Mặt Trời",role:"người dẫn chuyện",look:"friendly smiling cartoon sun with rosy cheeks",voice:"narrator"}],
sets:sets.map(s=>({name:s,look:s+", Vietnamese countryside village, rice fields, bamboo, sunny day"})),
shots:L.map((l,i)=>({set:sets[Math.min(2,Math.floor(i/2))],characters:[l[0]=="Ông Mặt Trời"?"Rùa Xanh":l[0],"Thỏ Bông"],action:["Toàn cảnh làng, hai bạn đứng ở vạch xuất phát","Thỏ cười lăn ra trêu Rùa","Rùa mỉm cười tự tin","Thỏ ngáp và ngủ gật dưới gốc đa","Rùa bò qua Thỏ đang ngủ","Rùa về đích, cả làng vỗ tay"][i],camera:["wide shot","medium shot","close-up","medium shot","tracking shot","wide shot"][i],dialogue:[{who:l[0],line:l[1]}],duration:8}))}}
async function writeScript(){if(BUSY)return;BUSY=1;const tale=TALES.find(t=>t.id==P.tale);const nShots=Math.round(P.min*60/8);log(tr("Đang xử lý…"),0);
const sys=`You are an award-winning children's animation screenwriter (ages ${P.age}). Write funny, warm, kid-safe 3D cartoon short films: no violence, no scary content, gentle slapstick humor, clear moral lesson, simple words. Vietnamese culture and village settings when relevant.`;
const user=`Story: ${P.idea||(tale.t+" – "+tale.d+" Moral: "+tale.m)}
Target length ${P.min} minutes = about ${nShots} shots of 6-10 seconds. Dialogue language: ${({vi:"Vietnamese",en:"English",zh:"Chinese"})[P.dlang]}.
Return JSON: {"title","moral","summary","characters":[{"name","role","look" (English, precise visual description for consistent 3D character design: species/age, body, colors, clothing, accessories),"voice" (one of narrator, man, woman, old_man, old_woman, child_boy, child_girl)}],"sets":[{"name","look" (English visual description)}],"shots":[{"set" (exact set name),"characters" (array of exact names visible),"action" (what happens, in dialogue language),"camera" (English: wide shot / medium / close-up / low angle...),"motion" (English: animation prompt for the video model, what moves),"dialogue":[{"who" (exact character name or narrator),"line" (short, max 20 words)}],"duration" (6-10)}]}

try{const j=pj(await llm(sys,user));P.script={title:j.title,moral:j.moral,summary:j.summary};P.name=j.title||P.name;

P.shots=(j.shots||[]).map(s=>({id:uid(),set:s.set,chars:s.characters||[],action:s.action,camera:s.camera,motion:s.motion||s.action,dialogue:s.dialogue||[],dur:Math.max(5,Math.min(10,+s.duration||8))}));save();log(tr("Xong"))}catch(e){log(tr("Lỗi")+": "+e.message,8000)}BUSY=0;render()}

async function blobToDU(b){return new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)})}

const w=String(text).split(" ");let ln="",y=c.height/2-60;for(const t of w){if(x.measureText(ln+t).width>c.width-120){x.fillText(ln,c.width/2,y);y+=52;ln=""}ln+=t+" "}x.fillText(ln,c.width/2,y);x.font="24px sans-serif";x.fillText("DEMO – "+tr("Chưa có key"),c.width/2,c.height-40);return new Promise(r=>c.toBlob(r,"image/jpeg",.9))}

for(let a=0;a<4;a++){try{const r=await fetch(u,S.pt_pkey?{headers:{Authorization:"Bearer "+S.pt_pkey}}:{});if(r.ok&&/image/.test(r.headers.get("content-type")||""))return await r.blob();last="HTTP "+r.status}catch(e){last=e.message}await new Promise(z=>setTimeout(z,6000*(a+1)))}throw new Error("Pollinations: "+last)}
if(ip=="hf"){if(!S.pt_hfkey)throw new Error("Hugging Face: "+tr("Chưa có key"));const r=await fetch("https://router.huggingface.co/hf-inference/models/"+(S.pt_hfm||"black-forest-labs/FLUX.1-schnell"),{method:"POST",headers:{Authorization:"Bearer "+S.pt_hfkey,"Content-Type":"application/json"},body:JSON.stringify({inputs:prompt,parameters:{width:w,height:hh}})});if(!r.ok)throw new Error("Hugging Face "+r.status+": "+(await r.text()).slice(0,200));return await r.blob()}
if(ip=="demo"||!S.pt_okey)return mockImg(prompt.split(".")[0].slice(0,80),sq);const size=sq?"1024x1024":"1536x1024";
const ims=[];for(const k of refs||[]){const b=await getB(k);if(b)ims.push({image_url:await blobToDU(b)})}const body={model:S.pt_im||"gpt-image-2.5-flare",prompt,n:1,size,quality:S.pt_iq||"medium",output_format:"jpeg"};if(ims.length)body.images=ims.slice(0,8);
const r=await fetch("https://api.openai.com/v1/images/"+(ims.length?"edits":"generations"),{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+S.pt_okey},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error("OpenAI Image "+r.status+": "+(j.error?.message||""));
return await (await fetch("data:image/jpeg;base64,"+j.data[0].b64_json)).blob()}

const du=await blobToDU(await getB(sh.img)),prompt=`${sh.motion||sh.action}. ${sh.camera}. ${STYLE}. Smooth cartoon animation, characters stay on-model, no text, no subtitles.`,dur=Math.round(sh.dur),H={"Content-Type":"application/json",Authorization:"Bearer "+key};let url;
if(p=="seedance"){const B="https://ark.ap-southeast.bytepluses.com/api/v3/contents/generations/tasks";const j=await vf(B,{method:"POST",headers:H,body:JSON.stringify({model:S.pt_seedm||"dreamina-seedance-2-5-260628",content:[{type:"text",text:prompt},{type:"image_url",image_url:{url:du},role:"first_frame"}],ratio:"16:9",duration:dur,resolution:"720p",generate_audio:false,watermark:false})},p);

else if(p=="kling"){const B="https://api-singapore.klingai.com";const j=await vf(B+"/image-to-video/kling-4.0",{method:"POST",headers:H,body:JSON.stringify({contents:[{type:"prompt",text:prompt},{type:"first_frame",url:du.split(",")[1]}],settings:{resolution:"720p",duration:dur}})},p);const id=j.data?.id;
url=await poll(async()=>{const t=(await vf(B+"/tasks?task_ids="+id,{headers:H},p)).data?.[0]||{};return t.status=="succeeded"?{url:(t.outputs||[]).find(o=>o.type=="video")?.url}:t.status=="failed"?{fail:t.message||"failed"}:{}},VP[p].n)}
else if(p=="minimax"){const B="https://api.minimax.io/v2";const j=await vf(B+"/video_generation",{method:"POST",headers:H,body:JSON.stringify({model:S.pt_minim||"MiniMax-H3-Max",content:[{type:"text",text:prompt},{type:"image_url",image_url:{url:du},role:"first_frame"}],resolution:"768P",duration:Math.max(5,Math.min(15,dur)),ratio:"16:9"})},p);
url=await poll(async()=>{const t=(await vf(B+"/query/video_generation/"+j.task_id,{headers:H},p)).task||{};return t.status=="succeeded"?{url:t.content?.url}:/failed|cancel/.test(t.status||"")?{fail:t.error?.message||t.status}:{}},VP[p].n)}
else if(p=="veo"){const m=S.pt_veom||"veo-3.1-fast-generate-001",G="https://generativelanguage.googleapis.com/v1beta/",GH={"Content-Type":"application/json","x-goog-api-key":key};let op=await vf(G+`models/${m}:predictLongRunning`,{method:"POST",headers:GH,body:JSON.stringify({instances:[{prompt,image:{bytesBase64Encoded:du.split(",")[1],mimeType:"image/jpeg"}}],parameters:{aspectRatio:"16:9",durationSeconds:Math.min(8,Math.max(4,dur))}})},p);

const VOICES={narrator:"sage",man:"onyx",woman:"nova",old_man:"ash",old_woman:"shimmer",child_boy:"echo",child_girl:"coral"};
const AC=()=>window._ac||(window._ac=new (window.AudioContext||window.webkitAudioContext)());
async function tts(text,voice,who){if(!S.pt_okey)return null;const r=await fetch("https://api.openai.com/v1/audio/speech",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+S.pt_okey},body:JSON.stringify({model:S.pt_ttsm||"gpt-4o-mini-tts",voice:VOICES[voice]||"sage",input:text,response_format:"wav",instructions:`You are voicing "${who}" in a funny children's cartoon. Speak ${({vi:"natural Vietnamese (Northern accent)",en:"English",zh:"Mandarin Chinese"})[P.dlang]}, expressive, warm, playful, clear and not too fast.`})});if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error("TTS "+r.status+": "+(j.error?.message||""))}return r.blob()}
function wav(buf){const n=buf.length,c=buf.numberOfChannels,sr=buf.sampleRate,b=new ArrayBuffer(44+n*c*2),v=new DataView(b);const w=(o,s)=>[...s].forEach((ch,i)=>v.setUint8(o+i,ch.charCodeAt(0)));w(0,"RIFF");v.setUint32(4,36+n*c*2,1);w(8,"WAVE");w(12,"fmt ");v.setUint32(16,16,1);v.setUint16(20,1,1);v.setUint16(22,c,1);v.setUint32(24,sr,1);v.setUint32(28,sr*c*2,1);v.setUint16(32,c*2,1);v.setUint16(34,16,1);w(36,"data");v.setUint32(40,n*c*2,1);let o=44;for(let i=0;i<n;i++)for(let ch=0;ch<c;ch++){const s=Math.max(-1,Math.min(1,buf.getChannelData(ch)[i]));v.setInt16(o,s<0?s*32768:s*32767,1);o+=2}return new Blob([b],{type:"audio/wav"})}
const RATE={narrator:1,man:.93,woman:1.08,old_man:.86,old_woman:1,child_boy:1.18,child_girl:1.26};let MMS={};
async function mmsTTS(text){if(P.dlang=="zh")throw new Error("MMS-TTS: chưa có giọng tiếng Trung miễn phí – dùng OpenAI TTS");const l=P.dlang=="en"?"eng":"vie";
if(!MMS[l]){log("Đang tải giọng đọc AI (~40MB, chỉ lần đầu)…",0);const T=await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.2");MMS[l]=await T.pipeline("text-to-speech","Xenova/mms-tts-"+l,{dtype:"q8"})}
const o=await MMS[l](text.replace(/[“”"*]/g,""));const b=AC().createBuffer(1,o.audio.length,o.sampling_rate);b.copyToChannel(o.audio,0);return b}
async function genVoice(sh){const parts=[],rates=[];for(const d of sh.dialogue){const c=P.chars.find(x=>x.name==d.who),v=c?.voice||"narrator";
if(TTSP()=="mms"){parts.push(await mmsTTS(d.line));rates.push(RATE[v]||1)}else{const b=await tts(d.line,v,d.who);if(b){parts.push(await AC().decodeAudioData(await b.arrayBuffer()));rates.push(1)}}}
if(!parts.length){sh.aud="";sh.adur=0;save();return}const sr=24000,gap=.35,len=parts.reduce((a,p,i)=>a+p.duration/rates[i]+gap,.3);const oc=new OfflineAudioContext(1,Math.ceil(len*sr),sr);let t=.3;sh.subs=[];
parts.forEach((p,i)=>{const s=oc.createBufferSource();s.buffer=p;s.playbackRate.value=rates[i];s.connect(oc.destination);s.start(t);const dd=p.duration/rates[i];sh.subs.push([t,t+dd,sh.dialogue[i].who+": "+sh.dialogue[i].line]);t+=dd+gap});
await setB("a_"+sh.id,wav(await oc.startRendering()));sh.aud="a_"+sh.id;sh.adur=len;save()}
async function genMusic(sec){const sr=22050,oc=new OfflineAudioContext(1,sr*sec,sr),bpm=112,b=60/bpm,sc=[0,2,4,7,9,12,14,16],root=261.63;const prog=[0,5,3,4];
const note=(f,t,d,type,g)=>{const o=oc.createOscillator(),e=oc.createGain();o.type=type;o.frequency.value=f;e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(g,t+.02);e.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(e).connect(oc.destination);o.start(t);o.stop(t+d+.05)};
let seed=7;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;const mel=[...Array(16)].map(()=>sc[Math.floor(rnd()*sc.length)]);
for(let t=0,i=0;t<sec-1;t+=b,i++){const ch=prog[Math.floor(i/4)%4],f=root*Math.pow(2,([0,5,9,7][Math.floor(i/4)%4]-12)/12);note(f,t,b*.9,"triangle",.25);if(i%2==0)note(f*2*Math.pow(2,4/12),t,b*.5,"sine",.08);
if(i%16<12||i%2)note(root*Math.pow(2,(mel[i%16]+(ch%2?2:0))/12),t+(i%2?b/2:0),b*.45,"square",.05)}
return wav(await oc.startRendering())}

function toast(){let d=document.getElementById("auT");const t=T[lang()];if(!d){d=document.createElement("div");d.id="auT";d.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom));z-index:2147483000;background:#111a;backdrop-filter:blur(6px);color:#fff;border:1px solid #fff3;border-radius:999px;padding:8px 8px 8px 16px;display:flex;gap:10px;align-items:center;font:600 14px system-ui,sans-serif;box-shadow:0 6px 24px #0008";
 d.innerHTML='<span></span><button style="background:#ffc800;color:#000;border:0;border-radius:999px;padding:7px 14px;font-weight:700;cursor:pointer"></button>';d.querySelector("button").onclick=()=>{if(st()=="busy"){d.querySelector("span").textContent="⏳ "+t[0]}else apply()};document.body.appendChild(d)}
 d.querySelector("span").textContent="🔄 "+t[0];d.querySelector("button").textContent=t[1]}
window.AU_TRY=()=>{if(!pending)return false;const s=st();if(s=="idle"){apply();return true}if(s=="work")toast();return false};
window.AU_PENDING=()=>!!pending;
async function check(){try{const r=await fetch("version.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)return;const j=await r.json();
 if(!j.v||j.v===CUR||CUR==="dev"||CUR.startsWith("__"))return;
 if(sessionStorage.auTried===j.v&&!pending){pending=null;return}/* tránh vòng lặp nếu CDN còn trả bản cũ */
 if(pending!==j.v){pending=j.v;if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js?v="+j.v,{scope:"./"}).catch(()=>{})}
 AU_TRY()}catch(e){}}
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js?v="+CUR,{scope:"./"}).catch(()=>{}));
setTimeout(check,2500);setInterval(check,5*60*1000);setInterval(()=>{if(pending)AU_TRY()},3000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")check()});addEventListener("focus",check);addEventListener("online",check);
})();</script>
