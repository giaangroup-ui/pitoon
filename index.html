function wav(buf){const n=buf.length,c=buf.numberOfChannels,sr=buf.sampleRate,b=new ArrayBuffer(44+n*c*2),v=new DataView(b);const w=(o,s)=>[...s].forEach((ch,i)=>v.setUint8(o+i,ch.charCodeAt(0)));w(0,"RIFF");v.setUint32(4,36+n*c*2,1);w(8,"WAVE");w(12,"fmt ");v.setUint32(16,16,1);v.setUint16(20,1,1);v.setUint16(22,c,1);v.setUint32(24,sr,1);v.setUint32(28,sr*c*2,1);v.setUint16(32,c*2,1);v.setUint16(34,16,1);w(36,"data");v.setUint32(40,n*c*2,1);let o=44;for(let i=0;i<n;i++)for(let ch=0;ch<c;ch++){const s=Math.max(-1,Math.min(1,buf.getChannelData(ch)[i]));v.setInt16(o,s<0?s*32768:s*32767,1);o+=2}return new Blob([b],{type:"audio/wav"})}

async function genVoice(sh){const parts=[],rates=[];for(const d of sh.dialogue){const c=P.chars.find(x=>x.name==d.who),v=c?.voice||"narrator";
if(TTSP()=="mms"){parts.push(await mmsTTS(d.line));rates.push((RATE[v]||1)*(EMOR[d.emo]||1))}else{const b=await tts(d.line,v,d.who);if(b){parts.push(await AC().decodeAudioData(await b.arrayBuffer()));rates.push(1)}}}
if(!parts.length){sh.aud="";sh.adur=0;save();return}const sr=24000,gap=.35,len=parts.reduce((a,p,i)=>a+p.duration/rates[i]+gap,.3);const oc=new OfflineAudioContext(1,Math.ceil(len*sr),sr);let t=.3;sh.subs=[];

async function genMusic(sec){const sr=22050,oc=new OfflineAudioContext(1,sr*sec,sr),bpm=112,b=60/bpm,sc=[0,2,4,7,9,12,14,16],root=261.63;const prog=[0,5,3,4];
const note=(f,t,d,type,g)=>{const o=oc.createOscillator(),e=oc.createGain();o.type=type;o.frequency.value=f;e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(g,t+.02);e.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(e).connect(oc.destination);o.start(t);o.stop(t+d+.05)};
let seed=7;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;const mel=[...Array(16)].map(()=>sc[Math.floor(rnd()*sc.length)]);
for(let t=0,i=0;t<sec-1;t+=b,i++){const ch=prog[Math.floor(i/4)%4],f=root*Math.pow(2,([0,5,9,7][Math.floor(i/4)%4]-12)/12);note(f,t,b*.9,"triangle",.25);if(i%2==0)note(f*2*Math.pow(2,4/12),t,b*.5,"sine",.08);

return wav(await oc.startRendering())}

const LIB={mammoth:"https://cdn.jsdelivr.net/npm/mammoth@1.9.1/mammoth.browser.min.js",pdfjs:"https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js",pdfworker:"https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js",tesseract:"https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js",heic:"https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"};
function loadLib(src){return new Promise((ok,er)=>{if([...document.scripts].some(s=>s.getAttribute("src")===src))return ok();const el=document.createElement("script");el.src=src;el.async=true;el.onload=()=>ok();el.onerror=()=>er(new Error(tr("Lỗi")+" tải thư viện"));document.head.appendChild(el)})}
function fileKind(f){const n=(f&&f.name||"").toLowerCase(),t=(f&&f.type||"").toLowerCase();if(t==="application/pdf"||n.endsWith(".pdf"))return"pdf";if(/wordprocessingml/.test(t)||n.endsWith(".docx"))return"docx";if(t==="application/msword"||n.endsWith(".doc"))return"doc";if(t.startsWith("image/")||/\.(png|jpe?g|gif|webp|bmp|heic|heif)$/.test(n))return"img";if(t.startsWith("text/")||/\.(txt|md|rtf|csv)$/.test(n))return"txt";return""}
async function decodeImg(blob){try{return await createImageBitmap(blob)}catch(e){}
const isHeic=/heic|heif/i.test(blob.type||"")||/\.(heic|heif)$/i.test(blob.name||"");
if(isHeic){try{await loadLib(LIB.heic);const out=await heic2any({blob,toType:"image/jpeg",quality:.85});const b=Array.isArray(out)?out[0]:out;return await createImageBitmap(b)}catch(e){}}
return await new Promise((ok,er)=>{const u=URL.createObjectURL(blob),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);ok(im)};im.onerror=()=>{URL.revokeObjectURL(u);er(new Error(tr("Ảnh này chưa mở được. Bé hãy chọn JPG, PNG hoặc WEBP nhé.")))};im.src=u})}
async function resizeBlob(blob,max){max=max||1024;const im=await decodeImg(blob);let w=im.width||im.naturalWidth,h=im.height||im.naturalHeight;if(w>max||h>max){const s=max/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s)}const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);if(im.close)try{im.close()}catch(e){}return await new Promise(r=>c.toBlob(b=>r(b||blob),"image/jpeg",.85))}
async function readDocx(f){await loadLib(LIB.mammoth);const r=await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()});return (r.value||"").replace(/\n{3,}/g,"\n\n").trim()}
async function readPdf(f){await loadLib(LIB.pdfjs);if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc=LIB.pdfworker;const doc=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let t="";for(let i=1;i<=doc.numPages;i++){const p=await doc.getPage(i),c=await p.getTextContent();t+=c.items.map(x=>x.str).join(" ")+"\n"}return t.replace(/[ \t]+\n/g,"\n").replace(/\n{3,}/g,"\n\n").trim()}
async function readPlain(f){return (await f.text()).replace(/^\uFEFF/,"").trim()}
async function ocrBlob(blob){log(tr("Đang đọc chữ trong ảnh…"),0);await loadLib(LIB.tesseract);const r=await Tesseract.recognize(blob,"vie+eng",{logger:m=>{if(m.status==="recognizing text")log(tr("Đang đọc chữ trong ảnh…")+" "+Math.round((m.progress||0)*100)+"%",0)}});return ((r&&r.data&&r.data.text)||"").replace(/[ \t]+\n/g,"\n").trim()}
function appendIdea(text){text=(text||"").replace(/\r\n/g,"\n").replace(/[ \t]+\n/g,"\n").replace(/\n{3,}/g,"\n\n").trim();if(!text)return false;P.idea=P.idea&&P.idea.trim()?P.idea.replace(/\s+$/,"")+"\n\n"+text:text;save();return true}

async function importStory(inp){const files=[...inp.files];inp.value="";await importStoryFiles(files)}
async function importStoryFiles(fileList){const files=[...fileList||[]].filter(Boolean);if(!files.length)return;log(tr("Đang nạp…"),0);let n=0,lastErr="";
try{for(const f of files){const k=fileKind(f);try{if(k==="docx"){if(appendIdea(await readDocx(f)))n++}else if(k==="pdf"){if(appendIdea(await readPdf(f)))n++}else if(k==="txt"){if(appendIdea(await readPlain(f)))n++}else if(k==="img"){const rec=await addRefImage(f,f.name||tr("Ảnh tham khảo"));n++;try{const tx=await ocrBlob(await getB(rec.img));const letters=(tx.match(/[\p{L}\p{N}]/gu)||[]).length;if(letters>=8){rec.text=tx;appendIdea(tx);save()}}catch(err){/* keep the picture even if OCR fails */}}else if(k==="doc"){lastErr=tr("File .doc cũ chưa đọc được. Bé lưu lại thành .docx hoặc PDF nhé.")}else{lastErr=tr("Chưa đọc được loại file này. Hãy dùng Word, PDF, TXT hoặc ảnh.")}}catch(err){lastErr=err.message||String(err)}}
if(n){log(tr("Đã nạp vào ô ý tưởng"));render()}else if(lastErr)log(lastErr,7000);else log(tr("Lỗi"),5000)}catch(e){log(tr("Lỗi")+": "+e.message,8000)}}
function askName(title,value,okLbl){return new Promise(res=>{const box=$("nameBody");if(!box){res(null);return}

const dlg=$("nameDlg");dlg.classList.add("on");const inp=$("nameInp");setTimeout(()=>{try{inp.focus();inp.select()}catch(e){}},30);
const done=v=>{if(!dlg.classList.contains("on"))return;dlg.classList.remove("on");dlg.onclick=null;res(v)};

async function renameProj(id){const cur=P&&P.id===id?P:await db("proj","readonly",s=>s.get(id));if(!cur)return;const n=await askName(tr("Đổi tên phim"),cur.name||tr("Phim mới"),tr("Lưu"));if(n==null)return;if(P&&P.id===id){P.name=n;if(P.script)P.script.title=n;save()}else{cur.name=n;if(cur.script)cur.script.title=n;cur.updated=Date.now();await db("proj","readwrite",s=>s.put(JSON.parse(JSON.stringify(cur)),cur.id))}if($("projDlg").classList.contains("on"))openProj();render()}

function openCharForm(opts){opts=opts||{};const c=opts.id&&(P.chars||[]).find(x=>x.id===opts.id);window._charBlob=opts.blob||null;window._charEdit=c?c.id:"";

$("charDlg").classList.add("on");setTimeout(()=>{try{$("charName").focus()}catch(e){}},30);if(window._charBlob)previewCharBlob(window._charBlob);fillImgs()}
async function previewCharBlob(blob){try{const b=blob.type&&blob.type.startsWith("image/")?blob:blob;const u=URL.createObjectURL(b);const box=$("charPrevBox");if(box)box.innerHTML=`<img id="charPrevImg" class="thumb sq" style="max-width:200px;margin:0 auto 8px" src="${u}" alt="">`}catch(e){}}
async function charPickFile(inp){const f=inp.files&&inp.files[0];inp.value="";if(!f)return;try{window._charBlob=await resizeBlob(f,1024);previewCharBlob(window._charBlob)}catch(e){log(tr("Lỗi")+": "+e.message,7000)}}
async function saveCharForm(){const name=(($("charName")||{}).value||"").trim(),role=(($("charRole")||{}).value||"").trim();if(!name){log(tr("Bé đặt tên cho nhân vật nhé!"),5000);return}

if(!c){c={id:uid(),name,role,look:role,voice:"child_girl",custom:true};P.chars.push(c)}else{c.name=name;c.role=role;c.look=role||c.look;c.custom=true;c.voice=c.voice||"child_girl"}
if(window._charBlob){const b=window._charBlob.type==="image/jpeg"?window._charBlob:await resizeBlob(window._charBlob,1024);await setB("c_"+c.id,b);c.img="c_"+c.id}

function delChar(id){if(!confirm(tr("Xóa")+"?"))return;const i=(P.chars||[]).findIndex(c=>c.id===id);if(i<0)return;const c=P.chars[i];P.chars.splice(i,1);(P.shots||[]).forEach(s=>{s.chars=(s.chars||[]).filter(n=>n!==c.name)});save();render()}
function toggleShotChar(si,name){const s=P.shots[si];if(!s)return;s.chars=s.chars||[];const i=s.chars.indexOf(name);if(i>=0)s.chars.splice(i,1);else s.chars.push(name);save();render()}
function customPrompt(){const kids=(P.chars||[]).filter(c=>c.custom);if(!kids.length)return"";return "\nThe child already designed these custom characters that MUST appear in the film, using these EXACT names:\n"+kids.map(c=>`- ${c.name}: ${c.role||c.look||""}${c.img?" (a reference photo is provided; keep the character recognizable)":""}`).join("\n")+"\nKeep these characters in the characters array and in relevant shots.\n"}
async function onAppPaste(e){const cd=e.clipboardData;if(!cd)return;if($("nameDlg")&&$("nameDlg").classList.contains("on"))return;if($("setDlg")&&$("setDlg").classList.contains("on"))return;
const files=[...cd.files].filter(Boolean);const fromItems=[...cd.items].filter(it=>it.kind==="file").map(it=>it.getAsFile()).filter(Boolean);const all=files.length?files:fromItems;const text=(cd.getData("text/plain")||"").trim();
const charOpen=$("charDlg")&&$("charDlg").classList.contains("on");
if(charOpen){const img=all.find(f=>fileKind(f)==="img");if(img){e.preventDefault();try{window._charBlob=await resizeBlob(img,1024);previewCharBlob(window._charBlob)}catch(err){log(tr("Lỗi")+": "+err.message,7000)}return}return}
if(TAB===1){const img=all.find(f=>fileKind(f)==="img");if(img){e.preventDefault();try{openCharForm({blob:await resizeBlob(img,1024)})}catch(err){log(tr("Lỗi")+": "+err.message,7000)}return}}
if(TAB!==0)return;
if(all.some(f=>["img","pdf","docx","txt","doc"].includes(fileKind(f)))){e.preventDefault();await importStoryFiles(all);return}
if(text){const a=document.activeElement;if(a&&(a.id==="idea"||/^(INPUT|TEXTAREA)$/.test(a.tagName)))return;e.preventDefault();if(appendIdea(text)){render();log(tr("Đã dán vào ô ý tưởng"))}}}
document.addEventListener("paste",e=>{onAppPaste(e).catch(err=>log(tr("Lỗi")+": "+err.message,7000))});

async function openProj(){const all=(await db("proj","readonly",s=>s.getAll()))||[];all.sort((a,b)=>b.updated-a.updated);$("projBody").innerHTML=`<h2>📁 ${tr("Dự án")}</h2><div class="row"><button class="btn" onclick="askNewProj()">＋ ${tr("Dự án mới")}</button><button class="b2" onclick="exportProj()">⬇ ${tr("Xuất file")}</button><label class="b2" style="margin:0;color:var(--t)">⬆ ${tr("Nhập dự án (.json)")}<input type="file" accept=".json,.pitoon,.pitoon.json,application/json" hidden onchange="importProj(this)"></label></div><p class="mut">${tr("Nhập dự án dùng file đã xuất từ PiToon. Muốn nạp truyện Word, PDF hay ảnh thì mở bước Kịch bản.")}</p>
${all.map(p=>`<div class="row" style="border-top:1px solid var(--b);padding:8px 0"><b style="flex:1">${esc(p.name)} ${p.id==P.id?"✓":""}<br><span class="mut">${new Date(p.updated||p.created).toLocaleString(LANG)} · ${(p.shots||[]).length} ${tr("Cảnh quay")}</span></b><button class="b2" onclick="renameProj('${p.id}')">✏️</button><button class="b2" onclick="loadProj('${p.id}')">${tr("Mở")}</button><button class="b2" onclick="delProj('${p.id}')">🗑</button></div>`).join("")}<button class="b2" style="margin-top:10px" onclick="projDlg.classList.remove('on')">${tr("Đóng")}</button>`;$("projDlg").classList.add("on")}

async function exportProj(){const o=JSON.parse(JSON.stringify(P));o._blobs={};for(const k of[...P.chars,...P.sets,...P.shots,...(P.refs||[])].flatMap(x=>[x.img,x.vid,x.aud]).concat([P.music,P.film]).filter(Boolean)){const b=await getB(k);if(b)o._blobs[k]=await blobToDU(b)}dl(new Blob([JSON.stringify(o)],{type:"application/json"}),(P.name||"phim")+".pitoon.json")}
async function importProj(inp){const o=JSON.parse(await inp.files[0].text());const bl=o._blobs||{};delete o._blobs;o.id=uid();for(const k in bl)await setB(k,await (await fetch(bl[k])).blob());P=o;S.pt_cur=o.id;save();$("projDlg").classList.remove("on");render()}
$("lang").value=LANG;$("lang").onchange=e=>{LANG=S.pt_lang=e.target.value;render()};
(async()=>{if(S.pt_cur)P=await db("proj","readonly",s=>s.get(S.pt_cur));if(!P)newProj();render()})();

<script>/* Tự động cập nhật phiên bản mới — không cần bấm gì */
(()=>{const CUR=(document.querySelector('meta[name="app-version"]')||{}).content||"dev";window.APP_VERSION=CUR;
const T={vi:"Đã có bản mới — đang cập nhật…",en:"New version available — updating…",zh:"有新版本 — 正在更新…"};

let pending=null;

const lang=()=>{try{const l=(window.AU_LANG?AU_LANG():document.documentElement.lang||"vi").slice(0,2);return T[l]?l:"vi"}catch(e){return"vi"}};
function toast(){let d=document.getElementById("auT");if(!d){d=document.createElement("div");d.id="auT";d.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom));z-index:2147483000;background:#111a;backdrop-filter:blur(6px);color:#fff;border:1px solid #fff3;border-radius:999px;padding:10px 18px;font:600 14px system-ui,sans-serif;box-shadow:0 6px 24px #0008";document.body.appendChild(d)}d.textContent="🔄 "+T[lang()]}
function apply(){if(!pending||apply._go)return;if(st()!=="idle"){toast();return}if(!apply._t){apply._t=1;toast();setTimeout(()=>{apply._t=2;apply()},1200);return}if(apply._t<2)return;apply._go=1;try{window.AU_BEFORE&&AU_BEFORE()}catch(e){}try{sessionStorage.pt_intro_skip="1";sessionStorage.pt_au_reload="1"}catch(e){}sessionStorage.auTried=pending;const u=new URL(location.href);u.searchParams.set("v",pending);location.replace(u.toString())}
window.AU_TRY=()=>{if(!pending)return false;if(st()==="idle"){apply();return true}toast();return false};

async function armSW(v){if(!("serviceWorker"in navigator))return;try{const reg=await navigator.serviceWorker.register("sw.js?v="+v,{scope:"/pitoon/"});const kick=w=>{if(w)w.postMessage("skipWaiting")};kick(reg.waiting);if(reg.installing)reg.installing.addEventListener("statechange",e=>{if(e.target.state==="installed")kick(reg.waiting||e.target)});await reg.update().catch(()=>{})}catch(e){}}

if("serviceWorker"in navigator){const boot=()=>navigator.serviceWorker.register("sw.js?v="+CUR,{scope:"/pitoon/"}).then(r=>{r.update().catch(()=>{});setInterval(()=>r.update().catch(()=>{}),5*60*1000)}).catch(()=>{});if(document.readyState==="complete")boot();else addEventListener("load",boot);navigator.serviceWorker.addEventListener("controllerchange",()=>{if(pending)AU_TRY()})}
check();setTimeout(check,2500);setInterval(check,5*60*1000);setInterval(()=>{if(pending)AU_TRY()},3000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")check()});addEventListener("focus",check);addEventListener("online",check);
})();</script>

const lang=()=>{try{const l=(window.AU_LANG?AU_LANG():document.documentElement.lang||"vi").slice(0,2);return TX[l]?l:"vi"}catch(e){return"vi"}};
const win=/windows|win32|win64/i.test(ua)||(navigator.userAgentData&&/windows/i.test(navigator.userAgentData.platform||""));
function openGuide(){const t=TX[lang()];let kind="other",steps=t.other,hd=t.t;
 if(ios){kind="ios";steps=t.ios;hd=t.iosT}else if(and){kind="and";steps=t.and}else if(win&&edge){kind="edgew";steps=t.edgew||t.edge}else if(edge){kind="edge";steps=t.edge}else if(safari){kind="mac";steps=t.mac}else if(/chrome|chromium|crios/i.test(ua)){kind="chrome";steps=t.win||t.chrome}
 if(title)title.textContent=hd;if(body)body.innerHTML="<ol>"+steps.map(s=>"<li>"+s+"</li>").join("")+"</ol><p class=mut>"+t.after+"</p>";
 if(illust)illust.classList.toggle("on",kind==="ios");
 const ox=document.getElementById("installGuideX");if(ox)ox.textContent=t.ok;
 if(guide)guide.hidden=false}
function toastInstalled(){let d=document.getElementById("instToast");if(!d){d=document.createElement("div");d.id="instToast";d.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom));z-index:2147483002;background:#1e2a4a;color:#fff;border-radius:999px;padding:12px 20px;font:700 14px Nunito,system-ui,sans-serif;box-shadow:0 8px 28px #0005;max-width:92vw;text-align:center";document.body.appendChild(d)}d.textContent="Đã cài PiToon! Tìm biểu tượng ở màn hình chính / menu Start";d.hidden=false;clearTimeout(d._t);d._t=setTimeout(()=>{d.hidden=true},6000)}
const bip=()=>window.__pitoonBIP||dp;
async function install(){if(standalone())return;const ev=bip();if(ev&&typeof ev.prompt==="function"){try{const p=ev.prompt();if(p&&p.then)await p;const r=await ev.userChoice;window.__pitoonBIP=null;dp=null;if(r&&r.outcome==="accepted"){hideAll();toastInstalled();try{localStorage.setItem(KEY,String(Date.now()))}catch(e){}}}catch(e){openGuide()}return}openGuide()}
dp=window.__pitoonBIP||dp;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;window.__pitoonBIP=e;showBtn()});
addEventListener("pitoon-bip",()=>{dp=window.__pitoonBIP||dp;showBtn()});
addEventListener("appinstalled",()=>{dp=null;window.__pitoonBIP=null;hideAll()});
addEventListener("pitoon-appinstalled",()=>hideAll());
if(window.__pitoonInstalled)hideAll();
showBtn();

setTimeout(waitBanner,1200);
btn.onclick=install;
const go=document.getElementById("installBannerGo"),bx=document.getElementById("installBannerX"),gx=document.getElementById("installGuideX");
if(go)go.onclick=()=>{dismiss();install()};if(bx)bx.onclick=dismiss;if(gx)gx.onclick=()=>{if(guide)guide.hidden=true};
if(guide)guide.addEventListener("click",e=>{if(e.target===guide)guide.hidden=true});
})();</script>
