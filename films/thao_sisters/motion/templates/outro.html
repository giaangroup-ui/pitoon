<!doctype html><html><head><meta charset=utf-8>
<link rel=stylesheet href=base.css>
<style>
body{background:linear-gradient(160deg,#FFE08A,#7EC8E3 50%,#FF9F6B);font-family:DejaVu Sans,Segoe UI,system-ui,sans-serif}
.cta{position:absolute;left:50%;top:22%;transform:translate(-50%,-50%) scale(0);font-size:clamp(22px,4.2vw,48px);
  font-weight:900;color:#fff;text-align:center;text-shadow:0 4px 0 #2B3FA0,0 8px 18px rgba(0,0,0,.3);width:90%;line-height:1.3}
.lesson{position:absolute;left:50%;top:48%;transform:translateX(-50%) scale(0);width:84%;font-size:clamp(15px,2.6vw,28px);text-align:center;
  font-weight:700;color:#2B3FA0;background:rgba(255,255,255,.94);border-radius:1.1em;padding:.7em 1em;box-shadow:0 6px 0 #E2B04A;line-height:1.4}
.char{position:absolute;bottom:3%;width:32%;height:36%;object-fit:contain;object-position:bottom;filter:drop-shadow(0 10px 8px rgba(0,0,0,.25));opacity:0}
.char.nguyen{left:8%} .char.my{right:8%}
</style></head><body>
<div class=stage>
  <div class=bg style="background:url('../assets/bg.jpg') center/cover;position:absolute;inset:0;opacity:.35"></div>
  <img class="char nguyen" id=nguyen src="../assets/nguyen.png" alt="">
  <img class="char my" id=my src="../assets/my.png" alt="">
  <div class=cta id=cta>Hãy biết sẻ chia, tôn trọng và giúp đỡ nhau.</div>
  <div class=lesson id=lesson>Khi gặp bạn nhỏ cần giúp đỡ, hãy báo cha mẹ, thầy cô hoặc người lớn đáng tin cậy. PiToon.</div>
</div>
<script>
class S{constructor(x=0,k=200,c=14){this.x=x;this.v=0;this.k=k;this.c=c;this.t=x}
set(t){this.t=t} step(dt){const a=-this.k*(this.x-this.t)-this.c*this.v;this.v+=a*dt;this.x+=this.v*dt;return this.x}}
const sA=new S,sL=new S,sN=new S,sM=new S; let start=0,prev=0;
function f(now){if(!start)start=now; const t=(now-start)/1000,dt=Math.min(.033,(now-prev)/1000||.016);prev=now;
  if(t>.1)sA.set(1); if(t>.45)sL.set(1); if(t>.2){sN.set(1);sM.set(1)}
  const A=sA.step(dt),L=sL.step(dt),N=sN.step(dt),M=sM.step(dt), bob=Math.sin(t*2.5)*3, w=Math.sin(t*5)*8;
  document.querySelector('.stage').style.transform=`translateY(${bob}px)`;
  cta.style.transform=`translate(-50%,-50%) scale(${.4+A*.7})`;
  lesson.style.transform=`translateX(-50%) scale(${.5+L*.5})`;
  nguyen.style.opacity=N; nguyen.style.transform=`translateY(${(1-N)*28}%) rotate(${w}deg)`;
  my.style.opacity=M; my.style.transform=`translateY(${(1-M)*28}%) rotate(${-w}deg)`;
  requestAnimationFrame(f)}
requestAnimationFrame(f); window.__DURATION=4.0; window.__READY=true;
</script></body></html>
