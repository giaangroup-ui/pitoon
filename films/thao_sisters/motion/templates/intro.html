<!doctype html><html><head><meta charset=utf-8>
<link rel=stylesheet href=base.css>
<style>
body{background:linear-gradient(160deg,#7EC8E3 0%,#FFE08A 55%,#FF9F6B 100%);font-family:DejaVu Sans,Segoe UI,system-ui,sans-serif}
.logo{font-size:clamp(40px,9vw,120px);position:absolute;left:50%;top:22%;transform:translate(-50%,-50%) scale(0);font-weight:900;color:#FFF;text-shadow:0 4px 0 #2B3FA0,0 8px 16px rgba(0,0,0,.25)}
.series{position:absolute;left:50%;top:36%;transform:translate(-50%,0) scale(0);font-size:clamp(18px,3.2vw,40px);color:#2B3FA0;font-weight:800;text-align:center;text-shadow:0 2px 0 #fff;width:86%;line-height:1.3}
.char{position:absolute;bottom:4%;width:38%;height:52%;object-fit:contain;object-position:bottom;filter:drop-shadow(0 10px 8px rgba(0,0,0,.25));opacity:0}
.char.nguyen{left:6%} .char.my{right:6%}
</style></head><body>
<div class=stage id=stage>
  <div class=bg style="background:url('../assets/bg.jpg') center/cover;position:absolute;inset:0;opacity:.45"></div>
  <img class="char nguyen" id=nguyen src="../assets/nguyen.png" alt="">
  <img class="char my" id=my src="../assets/my.png" alt="">
  <div class=logo id=logo>PiToon</div>
  <div class=series id=series>Hai chị em Thảo Nguyên – Thảo My<br>và người bạn ăn xin</div>
</div>
<script>
class S{constructor(x=0,k=240,c=14){this.x=x;this.v=0;this.k=k;this.c=c;this.t=x}
set(t){this.t=t} step(dt){const a=-this.k*(this.x-this.t)-this.c*this.v;this.v+=a*dt;this.x+=this.v*dt;return this.x}}
const sL=new S,sS=new S(0,200,16),sN=new S(0,180,14),sM=new S(0,180,14);
let start=0,prev=0;
function frame(now){
  if(!start) start=now; const t=(now-start)/1000, dt=Math.min(.033,(now-prev)/1000||.016); prev=now;
  if(t>.12)sL.set(1); if(t>.7)sS.set(1); if(t>.35){sN.set(1);sM.set(1)}
  const L=sL.step(dt),S=sS.step(dt),N=sN.step(dt),M=sM.step(dt), bob=Math.sin(t*2.4)*3;
  document.getElementById('stage').style.transform=`translateY(${bob}px)`;
  logo.style.transform=`translate(-50%,-50%) scale(${.25+L*.8})`; logo.style.opacity=Math.min(1,L*1.4);
  series.style.transform=`translate(-50%,0) scale(${.5+S*.5})`; series.style.opacity=S;
  nguyen.style.opacity=N; nguyen.style.transform=`translateY(${(1-N)*36}%)`;
  my.style.opacity=M; my.style.transform=`translateY(${(1-M)*36}%)`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame); window.__DURATION=3.6; window.__READY=true;
</script></body></html>
